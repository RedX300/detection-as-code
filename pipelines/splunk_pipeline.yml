# pipelines/splunk_pipeline.yml
name: DaC Custom Splunk Pipeline
priority: 20
transformations:
  # Map Sigma process_creation to Sysmon EventID 1
  - id: sysmon_process_creation
    type: add_condition
    conditions:
      source: "WinEventLog:Microsoft-Windows-Sysmon/Operational"
      EventCode: 1
    rule_conditions:
      - type: logsource
        category: process_creation
        product: windows

  # Map Windows Defender log source
  - id: windows_defender
    type: add_condition
    conditions:
      source: "WinEventLog:Microsoft-Windows-Windows Defender/Operational"
    rule_conditions:
      - type: logsource
        product: windows
        service: windefend

  # Field mappings for Sysmon data in Splunk
  - id: field_mapping
    type: field_name_mapping
    mapping:
      Image: process
      ParentImage: parent_process
      CommandLine: process_command_line
      User: user
      OriginalFileName: original_file_name
